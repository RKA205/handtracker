<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUMIT MAURYA // AI HAND SYSTEM</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cyan: #00fff7;
      --green: #00ff88;
      --red: #ff315c;
      --bg: #010608;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--cyan);
      font-family: "Courier New", monospace;
    }

    /* CAMERA */
    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter:
        brightness(.42)
        contrast(1.35)
        saturate(1.25);
      z-index: 1;
    }

    /* HAND CANVAS */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* DIGITAL SCANLINES */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(0,255,247,.025) 0px,
          rgba(0,255,247,.025) 1px,
          transparent 2px,
          transparent 5px
        );
    }

    /* VIGNETTE */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;

      background:
        radial-gradient(
          circle,
          transparent 35%,
          rgba(0,0,0,.65) 100%
        );
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: 68px;
      padding: 0 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(0,10,14,.78);
      border-bottom: 1px solid rgba(0,255,247,.4);

      backdrop-filter: blur(10px);

      z-index: 10;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-main {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 4px;

      text-shadow:
        0 0 5px var(--cyan),
        0 0 18px var(--cyan);
    }

    .brand-sub {
      margin-top: 3px;
      font-size: 9px;
      color: var(--green);
      letter-spacing: 2px;
    }

    /* SYSTEM STATUS */
    .system-status {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 10px;
      letter-spacing: 2px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;

      background: var(--red);
      box-shadow: 0 0 12px var(--red);
    }

    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 15px var(--green);
    }

    /* LEFT PANEL */
    .panel {
      position: fixed;
      top: 88px;
      left: 18px;

      width: 230px;

      padding: 16px;

      background: rgba(0,10,14,.70);

      border: 1px solid rgba(0,255,247,.25);
      border-left: 2px solid var(--cyan);

      box-shadow:
        0 0 25px rgba(0,255,247,.08),
        inset 0 0 25px rgba(0,255,247,.025);

      backdrop-filter: blur(9px);

      z-index: 8;
    }

    .panel-title {
      margin-bottom: 14px;

      font-size: 10px;
      color: #fff;
      letter-spacing: 2px;
    }

    .line {
      display: flex;
      justify-content: space-between;

      padding: 7px 0;

      border-bottom: 1px solid rgba(0,255,247,.08);

      font-size: 10px;
    }

    .value {
      color: #fff;
    }

    /* AI TERMINAL */
    .terminal {
      position: fixed;
      left: 18px;
      bottom: 22px;

      width: 330px;
      max-width: calc(100vw - 36px);

      padding: 12px;

      background: rgba(0,8,11,.78);
      border: 1px solid rgba(0,255,247,.25);

      z-index: 8;

      backdrop-filter: blur(8px);
    }

    .terminal-head {
      color: var(--green);
      font-size: 9px;
      margin-bottom: 7px;
      letter-spacing: 2px;
    }

    #terminalText {
      color: var(--cyan);
      font-size: 10px;
      line-height: 1.6;

      min-height: 32px;
    }

    /* PORTFOLIO */
    .portfolio {
      position: fixed;
      right: 18px;
      top: 88px;

      width: 245px;

      padding: 15px;

      background: rgba(0,9,13,.72);
      border: 1px solid rgba(0,255,247,.3);

      z-index: 8;

      backdrop-filter: blur(9px);
    }

    .portfolio-title {
      color: #fff;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .site {
      display: block;

      margin-top: 9px;
      padding: 11px;

      color: var(--cyan);
      text-decoration: none;

      border: 1px solid rgba(0,255,247,.2);

      background: rgba(0,255,247,.025);

      transition: .2s;
    }

    .site:hover {
      color: #000;
      background: var(--cyan);

      box-shadow:
        0 0 20px var(--cyan);
    }

    .site-name {
      display: block;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .site-url {
      display: block;
      margin-top: 5px;
      font-size: 8px;
      opacity: .75;
      word-break: break-all;
    }

    /* VOICE BUTTON */
    #voiceBtn {
      position: fixed;
      right: 20px;
      bottom: 25px;

      width: 55px;
      height: 55px;

      border-radius: 50%;

      border: 1px solid var(--cyan);
      background: rgba(0,20,25,.8);

      color: var(--cyan);

      font-size: 21px;

      cursor: pointer;

      box-shadow:
        0 0 12px rgba(0,255,247,.3);

      z-index: 12;
    }

    #voiceBtn.active {
      animation: voicePulse 1s infinite;

      color: #000;
      background: var(--cyan);
    }

    @keyframes voicePulse {
      0%,100% {
        box-shadow: 0 0 10px var(--cyan);
      }

      50% {
        box-shadow:
          0 0 35px var(--cyan),
          0 0 60px var(--cyan);
      }
    }

    /* CENTER CROSSHAIR */
    .crosshair {
      position: fixed;
      left: 50%;
      top: 50%;

      width: 70px;
      height: 70px;

      transform: translate(-50%, -50%);

      border: 1px solid rgba(0,255,247,.18);
      border-radius: 50%;

      z-index: 5;
      pointer-events: none;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";

      position: absolute;

      background: rgba(0,255,247,.25);
    }

    .crosshair::before {
      width: 100%;
      height: 1px;
      top: 50%;
    }

    .crosshair::after {
      height: 100%;
      width: 1px;
      left: 50%;
    }

    /* CORNERS */
    .corner {
      position: fixed;

      width: 42px;
      height: 42px;

      z-index: 7;
      pointer-events: none;
    }

    .tl {
      top: 78px;
      left: 12px;
      border-top: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }

    .tr {
      top: 78px;
      right: 12px;
      border-top: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    .bl {
      bottom: 12px;
      left: 12px;
      border-bottom: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }

    .br {
      bottom: 12px;
      right: 12px;
      border-bottom: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    /* RESPONSIVE */
    @media (max-width: 700px) {

      .brand-main {
        font-size: 13px;
        letter-spacing: 2px;
      }

      .brand-sub {
        font-size: 7px;
      }

      .panel {
        width: 180px;
        top: 78px;
        left: 10px;
        padding: 10px;
      }

      .portfolio {
        width: 180px;
        right: 10px;
        top: 78px;
        padding: 10px;
      }

      .terminal {
        width: 260px;
        left: 10px;
        bottom: 12px;
      }

      #voiceBtn {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- CAMERA -->
  <video id="video" autoplay muted playsinline></video>

  <!-- HAND TRACKING -->
  <canvas id="canvas"></canvas>

  <!-- EFFECTS -->
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <!-- TOP -->
  <header class="topbar">

    <div class="brand">
      <div class="brand-main">
        SUMIT MAURYA
      </div>

      <div class="brand-sub">
        AI VISION // HAND TRACKING SYSTEM
      </div>
    </div>

    <div class="system-status">
      <span id="statusDot" class="status-dot"></span>

      <span id="statusText">
        SYSTEM OFFLINE
      </span>
    </div>

  </header>


  <!-- SYSTEM PANEL -->
  <section class="panel">

    <div class="panel-title">
      [ NEURAL ANALYSIS ]
    </div>

    <div class="line">
      <span>LEFT HAND</span>
      <span id="leftHand" class="value">--</span>
    </div>

    <div class="line">
      <span>RIGHT HAND</span>
      <span id="rightHand" class="value">--</span>
    </div>

    <div class="line">
      <span>LANDMARKS</span>
      <span id="landmarks" class="value">0</span>
    </div>

    <div class="line">
      <span>FPS</span>
      <span id="fps" class="value">0</span>
    </div>

    <div class="line">
      <span>AI MODEL</span>
      <span class="value">MP-HANDS</span>
    </div>

    <div class="line">
      <span>MODE</span>
      <span class="value">REALTIME</span>
    </div>

  </section>


  <!-- PORTFOLIO -->
  <section class="portfolio">

    <div class="portfolio-title">
      [ SUMIT // PORTFOLIO ]
    </div>

    <a
      class="site"
      href="https://rka205.github.io/Sumit/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="site-name">
        PORTFOLIO_01
      </span>

      <span class="site-url">
        rka205.github.io/Sumit/
      </span>
    </a>

    <a
      class="site"
      href="https://rka205.github.io/SK/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="site-name">
        PROJECT_02
      </span>

      <span class="site-url">
        rka205.github.io/SK/
      </span>
    </a>

  </section>


  <!-- AI TERMINAL -->
  <section class="terminal">

    <div class="terminal-head">
      // AI TERMINAL
    </div>

    <div id="terminalText">
      Initializing neural vision...
    </div>

  </section>


  <!-- VOICE -->
  <button
    id="voiceBtn"
    title="AI Voice"
    aria-label="Start AI Voice"
  >
    🎙
  </button>


  <!-- CENTER TARGET -->
  <div class="crosshair"></div>


  <!-- CORNERS -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <script>
  // ==============================
  // SUMIT MAURYA // AI VISION CORE
  // ==============================

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  const leftHand = document.getElementById("leftHand");
  const rightHand = document.getElementById("rightHand");
  const landmarksText = document.getElementById("landmarks");
  const fpsText = document.getElementById("fps");

  const terminalText = document.getElementById("terminalText");
  const voiceBtn = document.getElementById("voiceBtn");

  // ------------------------------
  // CANVAS
  // ------------------------------

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // ------------------------------
  // TERMINAL
  // ------------------------------

  const terminalMessages = [
    "Initializing neural vision...",
    "Loading hand landmark network...",
    "Camera stream detected...",
    "Waiting for hand landmarks...",
    "AI vision core ready...",
    "Tracking module online..."
  ];

  let terminalIndex = 0;

  function terminalMessage(text) {
    terminalText.textContent = "> " + text;
  }

  setInterval(() => {
    terminalMessage(
      terminalMessages[terminalIndex]
    );

    terminalIndex =
      (terminalIndex + 1) %
      terminalMessages.length;

  }, 2200);

  // ------------------------------
  // MEDIAPIPE HANDS
  // ------------------------------

  const hands = new Hands({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence: 0.65
  });

  // ------------------------------
  // HAND CONNECTIONS
  // ------------------------------

  const connections = [
    [0, 1],
    [1, 2],
    [2, 3],
    [3, 4],

    [0, 5],
    [5, 6],
    [6, 7],
    [7, 8],

    [0, 9],
    [9, 10],
    [10, 11],
    [11, 12],

    [0, 13],
    [13, 14],
    [14, 15],
    [15, 16],

    [0, 17],
    [17, 18],
    [18, 19],
    [19, 20],

    [5, 9],
    [9, 13],
    [13, 17]
  ];

  // ------------------------------
  // COLORS
  // ------------------------------

  const CYAN = "#00fff7";
  const GREEN = "#00ff88";

  // ------------------------------
  // CONVERT POINT
  // ------------------------------

  function screenPoint(point) {
    return {
      x: (1 - point.x) * window.innerWidth,
      y: point.y * window.innerHeight
    };
  }

  // ------------------------------
  // DRAW CONNECTION
  // ------------------------------

  function drawConnection(a, b, color) {

    const p1 = screenPoint(a);
    const p2 = screenPoint(b);

    ctx.save();

    ctx.strokeStyle = color;
    ctx.lineWidth = 3;

    ctx.shadowColor = color;
    ctx.shadowBlur = 18;

    ctx.beginPath();

    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);

    ctx.stroke();

    // Bright core
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#ffffff";
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = 0.8;

    ctx.beginPath();

    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);

    ctx.stroke();

    ctx.restore();
  }

  // ------------------------------
  // DRAW LANDMARK
  // ------------------------------

  function drawLandmark(point, color, index) {

    const p = screenPoint(point);

    ctx.save();

    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#001416";

    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.3, 0, Math.PI * 2);
    ctx.fill();

    // Selected landmark numbers
    if ([0, 4, 8, 12, 16, 20].includes(index)) {

      ctx.font = "9px monospace";
      ctx.fillStyle = color;

      ctx.fillText(
        index,
        p.x + 9,
        p.y - 7
      );
    }

    ctx.restore();
  }

  // ------------------------------
  // BOUNDING BOX
  // ------------------------------

  function drawBox(landmarks, color, label) {

    let minX = 1;
    let minY = 1;
    let maxX = 0;
    let maxY = 0;

    landmarks.forEach(point => {

      minX = Math.min(minX, point.x);
      minY = Math.min(minY, point.y);

      maxX = Math.max(maxX, point.x);
      maxY = Math.max(maxY, point.y);
    });

    const pad = 0.025;

    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);

    maxX = Math.min(1, maxX + pad);
    maxY = Math.min(1, maxY + pad);

    const x =
      (1 - maxX) * window.innerWidth;

    const y =
      minY * window.innerHeight;

    const width =
      (maxX - minX) * window.innerWidth;

    const height =
      (maxY - minY) * window.innerHeight;

    ctx.save();

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;

    ctx.shadowColor = color;
    ctx.shadowBlur = 15;

    ctx.strokeRect(
      x,
      y,
      width,
      height
    );

    ctx.font = "bold 11px monospace";
    ctx.fillStyle = color;

    ctx.fillText(
      label,
      x,
      Math.max(15, y - 7)
    );

    ctx.restore();
  }

  // ------------------------------
  // HAND RESULTS
  // ------------------------------

  hands.onResults(results => {

    ctx.clearRect(
      0,
      0,
      window.innerWidth,
      window.innerHeight
    );

    const detected =
      results.multiHandLandmarks || [];

    const handedness =
      results.multiHandedness || [];

    let leftDetected = false;
    let rightDetected = false;

    let totalLandmarks = 0;

    detected.forEach((landmarks, i) => {

      totalLandmarks += landmarks.length;

      const mediaPipeLabel =
        handedness[i]?.label || "Unknown";

      /*
       * Because the displayed camera is mirrored,
       * swap the visual labels.
       */

      const visualLabel =
        mediaPipeLabel === "Left"
          ? "RIGHT"
          : "LEFT";

      const color =
        visualLabel === "LEFT"
          ? CYAN
          : GREEN;

      if (visualLabel === "LEFT") {
        leftDetected = true;
      }

      if (visualLabel === "RIGHT") {
        rightDetected = true;
      }

      // Skeleton
      connections.forEach(([a, b]) => {

        if (landmarks[a] && landmarks[b]) {
          drawConnection(
            landmarks[a],
            landmarks[b],
            color
          );
        }

      });

      // Landmarks
      landmarks.forEach((point, index) => {

        drawLandmark(
          point,
          color,
          index
        );

      });

      // Bounding box
      drawBox(
        landmarks,
        color,
        visualLabel + "_HAND // TRACKED"
      );
    });

    // ------------------------------
    // HUD
    // ------------------------------

    leftHand.textContent =
      leftDetected
        ? "DETECTED"
        : "--";

    rightHand.textContent =
      rightDetected
        ? "DETECTED"
        : "--";

    landmarksText.textContent =
      totalLandmarks;

    if (detected.length > 0) {

      statusDot.classList.add("online");

      statusText.textContent =
        "SYSTEM ONLINE // AI TRACKING";

      terminalMessage(
        detected.length === 2
          ? "Two hand neural tracking active..."
          : "Hand landmark tracking active..."
      );

    } else {

      statusDot.classList.remove("online");

      statusText.textContent =
        "SCANNING FOR HAND...";

    }

    updateFPS();
  });

  // ------------------------------
  // FPS
  // ------------------------------

  let frameCount = 0;
  let fpsTime = performance.now();

  function updateFPS() {

    frameCount++;

    const now = performance.now();

    if (now - fpsTime >= 1000) {

      fpsText.textContent =
        frameCount;

      frameCount = 0;
      fpsTime = now;
    }
  }

  // ------------------------------
  // CAMERA
  // ------------------------------

  async function startCamera() {

    try {

      terminalMessage(
        "Requesting camera permission..."
      );

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: {
              ideal: 1280
            },
            height: {
              ideal: 720
            }
          },
          audio: false
        });

      video.srcObject = stream;

      await video.play();

      const camera = new Camera(
        video,
        {
          width: 1280,
          height: 720,

          onFrame: async () => {

            await hands.send({
              image: video
            });

          }
        }
      );

      camera.start();

      statusText.textContent =
        "SYSTEM ONLINE // CAMERA READY";

      terminalMessage(
        "Neural vision system initialized."
      );

    } catch (error) {

      console.error(error);

      statusDot.classList.remove("online");

      statusText.textContent =
        "CAMERA PERMISSION REQUIRED";

      terminalMessage(
        "Camera access was not granted."
      );
    }
  }

  // ------------------------------
  // VOICE SYSTEM
  // ------------------------------

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  let recognition = null;
  let listening = false;

  function speak(text) {

    if (!("speechSynthesis" in window)) {
      return;
    }

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.rate = 0.95;
    utterance.pitch = 0.8;
    utterance.volume = 1;

    window.speechSynthesis.speak(
      utterance
    );
  }

  function handleVoiceCommand(command) {

    const text =
      command.toLowerCase().trim();

    terminalMessage(
      "VOICE >> " + command
    );

    if (
      text.includes("portfolio") ||
      text.includes("website one") ||
      text.includes("website 1")
    ) {

      speak(
        "Opening Sumit's portfolio."
      );

      window.open(
        "https://rka205.github.io/Sumit/",
        "_blank"
      );

      return;
    }

    if (
      text.includes("project") ||
      text.includes("website two") ||
      text.includes("website 2")
    ) {

      speak(
        "Opening Sumit's project website."
      );

      window.open(
        "https://rka205.github.io/SK/",
        "_blank"
      );

      return;
    }

    if (
      text.includes("hello") ||
      text.includes("hi")
    ) {

      speak(
        "Hello Sumit. AI vision system is online."
      );

      return;
    }

    if (
      text.includes("status") ||
      text.includes("system")
    ) {

      speak(
        detectedStatus()
      );

      return;
    }

    speak(
      "Command received. I am ready."
    );
  }

  function detectedStatus() {

    const left =
      leftHand.textContent === "DETECTED";

    const right =
      rightHand.textContent === "DETECTED";

    if (left && right) {
      return "Both hands are detected.";
    }

    if (left) {
      return "Left hand is detected.";
    }

    if (right) {
      return "Right hand is detected.";
    }

    return "No hand detected.";
  }

  if (SpeechRecognition) {

    recognition =
      new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {

      listening = true;

      voiceBtn.classList.add("active");

      terminalMessage(
        "Voice input listening..."
      );
    };

    recognition.onresult = event => {

      const command =
        event.results[0][0].transcript;

      handleVoiceCommand(command);
    };

    recognition.onerror = event => {

      console.log(
        "Voice error:",
        event.error
      );

      terminalMessage(
        "Voice input error: " +
        event.error
      );
    };

    recognition.onend = () => {

      listening = false;

      voiceBtn.classList.remove("active");
    };

  } else {

    terminalMessage(
      "Voice recognition unavailable in this browser."
    );

    voiceBtn.disabled = true;
  }

  voiceBtn.addEventListener(
    "click",
    () => {

      if (!recognition) {
        return;
      }

      if (listening) {
        recognition.stop();
        return;
      }

      try {

        recognition.start();

      } catch (error) {

        console.log(error);

      }
    }
  );

  // ------------------------------
  // START SYSTEM
  // ------------------------------

  startCamera();

    </script>
