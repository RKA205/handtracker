<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUMIT MAURYA // NEURAL HUD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020608;color:#00fff7;font-family:Consolas,monospace}#video,canvas{position:fixed;inset:0;width:100%;height:100%}#video{object-fit:cover;transform:scaleX(-1);opacity:.3;filter:brightness(1.08) contrast(1.08)}canvas{pointer-events:none}.hud,.links,.term{position:fixed;z-index:10;background:#001015c9;border:1px solid #00fff766;box-shadow:0 0 25px #00fff722;backdrop-filter:blur(8px);padding:14px}.hud{top:15px;left:15px;width:300px}.links{top:15px;right:15px;width:210px}.term{left:15px;bottom:15px;width:min(600px,calc(100% - 30px));font-size:11px}.brand{font-size:20px;font-weight:bold;letter-spacing:2px}.sub{font-size:9px;opacity:.65;margin:5px 0 12px}.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #00fff71a;font-size:11px}.ok{color:#00ff88}button{background:transparent;color:#00fff7;border:1px solid #00fff7;padding:7px;margin:4px 2px;font:10px monospace}button:hover,button.active{background:#00fff7;color:#001015}.links a{display:block;color:#00fff7;text-decoration:none;border:1px solid #00fff733;padding:7px;margin-top:7px;font-size:10px}#cursor{position:fixed;z-index:20;width:18px;height:18px;border:2px solid #00fff7;border-radius:50%;display:none;pointer-events:none;box-shadow:0 0 15px #00fff7}.boot{position:fixed;inset:0;z-index:50;background:#020608;display:grid;place-items:center;text-align:center}.boot b{font-size:25px;letter-spacing:4px}.bar{width:300px;height:5px;border:1px solid #00fff7;margin:15px auto}.bar i{display:block;height:100%;background:#00fff7;animation:load 2s forwards}@keyframes load{to{width:100%}}
</style></head><body>
<div class="boot" id="boot"><div><b>SUMIT MAURYA</b><div>NEURAL HAND + FACE VISION</div><div class="bar"><i></i></div><small>INITIALIZING...</small></div></div>
<video id="video" autoplay muted playsinline></video><canvas id="vision"></canvas><canvas id="face"></canvas><canvas id="air"></canvas><div id="cursor"></div>
<div class="hud" id="hud"><div class="brand">SUMIT MAURYA</div><div class="sub">TOUCHLESS AI CONTROL // v2</div>
<div class="row"><span>SYSTEM</span><span id="sys">SCANNING</span></div><div class="row"><span>HANDS</span><span id="hc">0</span></div><div class="row"><span>FACE</span><span id="fc">--</span></div><div class="row"><span>LANDMARKS</span><span id="lm">0</span></div><div class="row"><span>GESTURE</span><span id="gs">IDLE</span></div><div class="row"><span>FPS</span><span id="fps">0</span></div>
<button id="voice">VOICE</button><button id="clear">CLEAR</button><button id="front">FRONT</button><button id="back">BACK</button><button id="max">MAX</button><button id="min">MIN</button><button id="bright">BRIGHT+</button></div>
<div class="links"><b>NETWORK</b><a href="https://rka205.github.io/Sumit/" target="_blank">SUMIT PORTFOLIO ↗</a><a href="https://rka205.github.io/SK/" target="_blank">SK PROJECT ↗</a></div>
<div class="term" id="term">&gt; BOOTING...</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script>
"use strict";
const $=x=>document.getElementById(x),V=$("video"),VC=$("vision"),FC=$("face"),AC=$("air"),vx=VC.getContext("2d"),fx=FC.getContext("2d"),ax=AC.getContext("2d");
const S={facing:"user",bright:1.08,last:null,gesture:"",since:0,action:0,min:false,stream:null,cam:null};
function size(){let d=Math.min(devicePixelRatio||1,2);[VC,FC,AC].forEach(c=>{c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px"});[vx,fx,ax].forEach(c=>c.setTransform(d,0,0,d,0,0))}size();onresize=size;
const P=p=>({x:(1-p.x)*innerWidth,y:p.y*innerHeight}),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),log=x=>$("term").textContent="> "+x;
function fingers(h){return[h[8].y<h[6].y,h[12].y<h[10].y,h[16].y<h[14].y,h[20].y<h[18].y]}
function hud(min){S.min=min;$("hud").style.opacity=min?".08":"1";$("hud").style.transform=min?"scale(.75)":"scale(1)";$("gs").textContent=min?"MINIMIZED":"MAXIMIZED";log("HUD // "+(min?"MINIMIZED":"MAXIMIZED"))}
function clear(){ax.clearRect(0,0,innerWidth,innerHeight);S.last=null;log("AIR CANVAS // CLEARED")}
$("clear").onclick=clear;$("max").onclick=()=>hud(false);$("min").onclick=()=>hud(true);$("bright").onclick=()=>{S.bright=Math.min(1.6,S.bright+.12);V.style.filter=`brightness(${S.bright}) contrast(1.08)`};
const con=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
function hand(h,c,l){let p=h.map(P);vx.save();vx.strokeStyle=c;vx.lineWidth=2.5;vx.shadowColor=c;vx.shadowBlur=12;con.forEach(([a,b])=>{vx.beginPath();vx.moveTo(p[a].x,p[a].y);vx.lineTo(p[b].x,p[b].y);vx.stroke()});p.forEach(q=>{vx.fillStyle=c;vx.beginPath();vx.arc(q.x,q.y,4,0,7);vx.fill()});let xs=p.map(q=>q.x),ys=p.map(q=>q.y);let x=Math.min(...xs)-10,y=Math.min(...ys)-18,w=Math.max(...xs)-Math.min(...xs)+20,hg=Math.max(...ys)-Math.min(...ys)+28;vx.shadowBlur=0;vx.strokeRect(x,y,w,hg);vx.font="10px monospace";vx.fillText(l,x,y-4);vx.restore()}
function face(l){fx.clearRect(0,0,innerWidth,innerHeight);if(!l)return;let p=l.map(P),xs=p.map(q=>q.x),ys=p.map(q=>q.y),x=Math.min(...xs)-8,y=Math.min(...ys)-8,w=Math.max(...xs)-Math.min(...xs)+16,h=Math.max(...ys)-Math.min(...ys)+16;fx.save();fx.strokeStyle="#ff4cff";fx.shadowColor="#ff4cff";fx.shadowBlur=10;fx.strokeRect(x,y,w,h);[1,33,61,199,263,291].forEach(i=>{let q=p[i];fx.fillStyle="#ff4cff";fx.beginPath();fx.arc(q.x,q.y,2.5,0,7);fx.fill()});fx.font="10px monospace";fx.fillText("FACE // DETECTED",x,y-5);fx.restore()}
function stable(n){let t=performance.now();if(S.gesture!==n){S.gesture=n;S.since=t;return false}return t-S.since>180}
function process(h){let f=fingers(h),pin=D(h[4],h[8])<.07,index=f[0]&&!f[1]&&!f[2]&&!f[3],two=f[0]&&f[1]&&!f[2]&&!f[3],palm=f.every(Boolean),fist=f.every(x=>!x);
if(index&&!pin){if(stable("WRITE"))$("gs").textContent="AIR WRITING";let p=P(h[8]);$("cursor").style.display="block";$("cursor").style.left=p.x-9+"px";$("cursor").style.top=p.y-9+"px";if(S.last){let q={x:S.last.x+(p.x-S.last.x)*.3,y:S.last.y+(p.y-S.last.y)*.3};ax.save();ax.strokeStyle="#00fff7";ax.lineWidth=4;ax.lineCap="round";ax.shadowColor="#00fff7";ax.shadowBlur=18;ax.beginPath();ax.moveTo(S.last.x,S.last.y);ax.lineTo(q.x,q.y);ax.stroke();ax.restore();S.last=q}else S.last=p;return}
S.last=null;
if(pin){if(stable("PINCH"))$("gs").textContent="PINCH SELECT";return}
if(two){if(stable("MOVE"))$("gs").textContent="TWO-FINGER NAV";return}
$("cursor").style.display="none";
if(palm){if(stable("PALM"))$("gs").textContent="OPEN PALM";if(performance.now()-S.since>850&&!S.min&&performance.now()-S.action>900){hud(false);S.action=performance.now()}return}
if(fist){if(stable("FIST"))$("gs").textContent="FIST HOLD";if(performance.now()-S.since>1000&&!S.min&&performance.now()-S.action>900){hud(true);S.action=performance.now()}if(performance.now()-S.since>3000&&performance.now()-S.action>900){clear();S.action=performance.now()}return}
S.gesture="";$("gs").textContent="IDLE"}
const H=new Hands({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+f});H.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.72,minTrackingConfidence:.72});
const F=new FaceMesh({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"+f});F.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.7,minTrackingConfidence:.7});
let n=0,t0=performance.now();
H.onResults(r=>{vx.clearRect(0,0,innerWidth,innerHeight);let hs=r.multiHandLandmarks||[],hd=r.multiHandedness||[];$("hc").textContent=hs.length;$("lm").textContent=hs.length*21;hs.forEach((h,i)=>{hand(h,hd[i]?.label==="Left"?"#00ff88":"#00fff7",(hd[i]?.label==="Left"?"RIGHT":"LEFT")+" // TRACKED");process(h)});$("sys").textContent=hs.length?"AI ONLINE":"SCANNING";n++;let now=performance.now();if(now-t0>1000){$("fps").textContent=n;n=0;t0=now}});
F.onResults(r=>{let l=r.multiFaceLandmarks?.[0]||null;$("fc").textContent=l?"DETECTED":"--";$("fc").className=l?"ok":"";face(l)});
async function stop(){if(S.cam)try{S.cam.stop()}catch(e){}if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
async function camera(mode){await stop();S.facing=mode;try{S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720}},audio:false});V.srcObject=S.stream;await V.play();S.cam=new Camera(V,{width:1280,height:720,onFrame:async()=>{await H.send({image:V});await F.send({image:V})}});S.cam.start();log("CAMERA // "+(mode==="user"?"FRONT":"BACK")+" ONLINE")}catch(e){log("CAMERA ERROR // ALLOW ACCESS")}}
$("front").onclick=()=>camera("user");$("back").onclick=()=>camera("environment");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let R=SR?new SR():null;if(R){R.lang="en-IN";R.onstart=()=>$("voice").classList.add("active");R.onend=()=>$("voice").classList.remove("active");R.onresult=e=>cmd(e.results[0][0].transcript.toLowerCase())}
function speak(t){if(!("speechSynthesis"in window))return;let u=new SpeechSynthesisUtterance(t);u.lang="en-IN";speechSynthesis.cancel();speechSynthesis.speak(u)}
async function cmd(c){log("VOICE // "+c);if(c.includes("portfolio")||c.includes("sumit")){open("https://rka205.github.io/Sumit/","_blank");speak("Opening portfolio")}else if(c.includes("project")||c.includes("school")){open("https://rka205.github.io/SK/","_blank");speak("Opening project")}else if(c.includes("front"))await camera("user");else if(c.includes("back")||c.includes("rear"))await camera("environment");else if(c.includes("maximize"))hud(false);else if(c.includes("minimize"))hud(true);else if(c.includes("clear"))clear();else if(c.includes("bright"))$("bright").click();else speak("Commands: portfolio, project, front, back, maximize, minimize, clear, brightness")}
$("voice").onclick=()=>{if(R)try{R.start()}catch(e){}else log("VOICE NOT SUPPORTED")};
onkeydown=e=>{let k=e.key.toLowerCase();if(k==="v")$("voice").click();if(k==="c")clear();if(k==="m")hud(true);if(k==="x")hud(false);if(k==="p")open("https://rka205.github.io/Sumit/","_blank")};
setTimeout(()=>{$("boot").style.display="none";camera("user")},2200);
</script></body></html>
