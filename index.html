<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>SUMIT MAURYA // AI HAND SYSTEM</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cyan: #00fff7;
      --green: #00ff88;
      --red: #ff315c;
      --bg: #010608;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--cyan);
      font-family: "Courier New", monospace;
    }

    /* CAMERA */
    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter:
        brightness(.42)
        contrast(1.35)
        saturate(1.25);
      z-index: 1;
    }

    /* HAND CANVAS */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* DIGITAL SCANLINES */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(0,255,247,.025) 0px,
          rgba(0,255,247,.025) 1px,
          transparent 2px,
          transparent 5px
        );
    }

    /* VIGNETTE */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;

      background:
        radial-gradient(
          circle,
          transparent 35%,
          rgba(0,0,0,.65) 100%
        );
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: 68px;
      padding: 0 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(0,10,14,.78);
      border-bottom: 1px solid rgba(0,255,247,.4);

      backdrop-filter: blur(10px);

      z-index: 10;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-main {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 4px;

      text-shadow:
        0 0 5px var(--cyan),
        0 0 18px var(--cyan);
    }

    .brand-sub {
      margin-top: 3px;
      font-size: 9px;
      color: var(--green);
      letter-spacing: 2px;
    }

    /* SYSTEM STATUS */
    .system-status {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 10px;
      letter-spacing: 2px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;

      background: var(--red);
      box-shadow: 0 0 12px var(--red);
    }

    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 15px var(--green);
    }

    /* LEFT PANEL */
    .panel {
      position: fixed;
      top: 88px;
      left: 18px;

      width: 230px;

      padding: 16px;

      background: rgba(0,10,14,.70);

      border: 1px solid rgba(0,255,247,.25);
      border-left: 2px solid var(--cyan);

      box-shadow:
        0 0 25px rgba(0,255,247,.08),
        inset 0 0 25px rgba(0,255,247,.025);

      backdrop-filter: blur(9px);

      z-index: 8;
    }

    .panel-title {
      margin-bottom: 14px;

      font-size: 10px;
      color: #fff;
      letter-spacing: 2px;
    }

    .line {
      display: flex;
      justify-content: space-between;

      padding: 7px 0;

      border-bottom: 1px solid rgba(0,255,247,.08);

      font-size: 10px;
    }

    .value {
      color: #fff;
    }

    /* AI TERMINAL */
    .terminal {
      position: fixed;
      left: 18px;
      bottom: 22px;

      width: 330px;
      max-width: calc(100vw - 36px);

      padding: 12px;

      background: rgba(0,8,11,.78);
      border: 1px solid rgba(0,255,247,.25);

      z-index: 8;

      backdrop-filter: blur(8px);
    }

    .terminal-head {
      color: var(--green);
      font-size: 9px;
      margin-bottom: 7px;
      letter-spacing: 2px;
    }

    #terminalText {
      color: var(--cyan);
      font-size: 10px;
      line-height: 1.6;

      min-height: 32px;
    }

    /* PORTFOLIO */
    .portfolio {
      position: fixed;
      right: 18px;
      top: 88px;

      width: 245px;

      padding: 15px;

      background: rgba(0,9,13,.72);
      border: 1px solid rgba(0,255,247,.3);

      z-index: 8;

      backdrop-filter: blur(9px);
    }

    .portfolio-title {
      color: #fff;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .site {
      display: block;

      margin-top: 9px;
      padding: 11px;

      color: var(--cyan);
      text-decoration: none;

      border: 1px solid rgba(0,255,247,.2);

      background: rgba(0,255,247,.025);

      transition: .2s;
    }

    .site:hover {
      color: #000;
      background: var(--cyan);

      box-shadow:
        0 0 20px var(--cyan);
    }

    .site-name {
      display: block;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .site-url {
      display: block;
      margin-top: 5px;
      font-size: 8px;
      opacity: .75;
      word-break: break-all;
    }

    /* VOICE BUTTON */
    #voiceBtn {
      position: fixed;
      right: 20px;
      bottom: 25px;

      width: 55px;
      height: 55px;

      border-radius: 50%;

      border: 1px solid var(--cyan);
      background: rgba(0,20,25,.8);

      color: var(--cyan);

      font-size: 21px;

      cursor: pointer;

      box-shadow:
        0 0 12px rgba(0,255,247,.3);

      z-index: 12;
    }

    #voiceBtn.active {
      animation: voicePulse 1s infinite;

      color: #000;
      background: var(--cyan);
    }

    @keyframes voicePulse {
      0%,100% {
        box-shadow: 0 0 10px var(--cyan);
      }

      50% {
        box-shadow:
          0 0 35px var(--cyan),
          0 0 60px var(--cyan);
      }
    }

    /* CENTER CROSSHAIR */
    .crosshair {
      position: fixed;
      left: 50%;
      top: 50%;

      width: 70px;
      height: 70px;

      transform: translate(-50%, -50%);

      border: 1px solid rgba(0,255,247,.18);
      border-radius: 50%;

      z-index: 5;
      pointer-events: none;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";

      position: absolute;

      background: rgba(0,255,247,.25);
    }

    .crosshair::before {
      width: 100%;
      height: 1px;
      top: 50%;
    }

    .crosshair::after {
      height: 100%;
      width: 1px;
      left: 50%;
    }

    /* CORNERS */
    .corner {
      position: fixed;

      width: 42px;
      height: 42px;

      z-index: 7;
      pointer-events: none;
    }

    .tl {
      top: 78px;
      left: 12px;
      border-top: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }

    .tr {
      top: 78px;
      right: 12px;
      border-top: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    .bl {
      bottom: 12px;
      left: 12px;
      border-bottom: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }

    .br {
      bottom: 12px;
      right: 12px;
      border-bottom: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    /* RESPONSIVE */
    @media (max-width: 700px) {

      .brand-main {
        font-size: 13px;
        letter-spacing: 2px;
      }

      .brand-sub {
        font-size: 7px;
      }

      .panel {
        width: 180px;
        top: 78px;
        left: 10px;
        padding: 10px;
      }

      .portfolio {
        width: 180px;
        right: 10px;
        top: 78px;
        padding: 10px;
      }

      .terminal {
        width: 260px;
        left: 10px;
        bottom: 12px;
      }

      #voiceBtn {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

  <script>
/* =====================================================
   SUMIT MAURYA // AI HAND + GESTURE SYSTEM
   ===================================================== */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

const leftHandEl = document.getElementById("leftHand");
const rightHandEl = document.getElementById("rightHand");
const landmarksEl = document.getElementById("landmarks");
const fpsEl = document.getElementById("fps");

const terminalText = document.getElementById("terminalText");
const voiceBtn = document.getElementById("voiceBtn");

/* =====================================================
   SETTINGS
   ===================================================== */

const CYAN = "#00fff7";
const GREEN = "#00ff88";

let lastFrameTime = performance.now();
let frameCounter = 0;

let drawing = false;
let lastDrawPoint = null;

let hudMinimized = false;

let fistStart = 0;
let fistActionDone = false;

let palmStart = 0;
let palmActionDone = false;

let currentGesture = "NONE";


/* =====================================================
   CANVAS
   ===================================================== */

function resizeCanvas() {

  const dpr =
    Math.min(window.devicePixelRatio || 1, 2);

  canvas.width =
    window.innerWidth * dpr;

  canvas.height =
    window.innerHeight * dpr;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


/* =====================================================
   AIR DRAWING CANVAS
   ===================================================== */

const drawCanvas =
  document.createElement("canvas");

drawCanvas.style.position = "fixed";
drawCanvas.style.left = "0";
drawCanvas.style.top = "0";
drawCanvas.style.width = "100%";
drawCanvas.style.height = "100%";
drawCanvas.style.zIndex = "6";
drawCanvas.style.pointerEvents = "none";

document.body.appendChild(drawCanvas);

const drawCtx =
  drawCanvas.getContext("2d");

function resizeDrawCanvas() {

  const dpr =
    Math.min(window.devicePixelRatio || 1, 2);

  drawCanvas.width =
    window.innerWidth * dpr;

  drawCanvas.height =
    window.innerHeight * dpr;

  drawCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resizeDrawCanvas
);

resizeDrawCanvas();


/* =====================================================
   TERMINAL
   ===================================================== */

function terminalMessage(message) {

  if (!terminalText) return;

  terminalText.textContent =
    "> " + message;
}


/* =====================================================
   MEDIAPIPE HANDS
   ===================================================== */

const hands = new Hands({

  locateFile: (file) => {
    return (
      "https://cdn.jsdelivr.net/npm/" +
      "@mediapipe/hands/" +
      file
    );
  }

});

hands.setOptions({

  maxNumHands: 2,

  modelComplexity: 1,

  minDetectionConfidence: 0.65,

  minTrackingConfidence: 0.65

});


/* =====================================================
   HAND CONNECTIONS
   ===================================================== */

const connections = [

  [0, 1],
  [1, 2],
  [2, 3],
  [3, 4],

  [0, 5],
  [5, 6],
  [6, 7],
  [7, 8],

  [0, 9],
  [9, 10],
  [10, 11],
  [11, 12],

  [0, 13],
  [13, 14],
  [14, 15],
  [15, 16],

  [0, 17],
  [17, 18],
  [18, 19],
  [19, 20],

  [5, 9],
  [9, 13],
  [13, 17]

];


/* =====================================================
   SCREEN POSITION
   ===================================================== */

function screenPoint(point) {

  return {

    x:
      (1 - point.x) *
      window.innerWidth,

    y:
      point.y *
      window.innerHeight

  };
}


/* =====================================================
   DRAW NEON CONNECTION
   ===================================================== */

function drawConnection(
  a,
  b,
  color
) {

  const p1 =
    screenPoint(a);

  const p2 =
    screenPoint(b);

  ctx.save();

  ctx.strokeStyle = color;

  ctx.lineWidth = 3;

  ctx.shadowColor = color;

  ctx.shadowBlur = 18;

  ctx.beginPath();

  ctx.moveTo(
    p1.x,
    p1.y
  );

  ctx.lineTo(
    p2.x,
    p2.y
  );

  ctx.stroke();

  ctx.shadowBlur = 0;

  ctx.strokeStyle = "#ffffff";

  ctx.globalAlpha = 0.65;

  ctx.lineWidth = 0.8;

  ctx.beginPath();

  ctx.moveTo(
    p1.x,
    p1.y
  );

  ctx.lineTo(
    p2.x,
    p2.y
  );

  ctx.stroke();

  ctx.restore();
}


/* =====================================================
   DRAW LANDMARK
   ===================================================== */

function drawLandmark(
  point,
  color,
  index
) {

  const p =
    screenPoint(point);

  ctx.save();

  ctx.fillStyle = color;

  ctx.shadowColor = color;

  ctx.shadowBlur = 20;

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    6,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle = "#001416";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    3,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "#ffffff";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    1.3,
    0,
    Math.PI * 2
  );

  ctx.fill();

  if (
    index === 0 ||
    index === 4 ||
    index === 8 ||
    index === 12 ||
    index === 16 ||
    index === 20
  ) {

    ctx.font =
      "9px monospace";

    ctx.fillStyle = color;

    ctx.fillText(
      String(index),
      p.x + 9,
      p.y - 7
    );
  }

  ctx.restore();
}


/* =====================================================
   BOUNDING BOX
   ===================================================== */

function drawBoundingBox(
  landmarks,
  color,
  label
) {

  let minX = 1;
  let minY = 1;
  let maxX = 0;
  let maxY = 0;

  landmarks.forEach(point => {

    minX =
      Math.min(minX, point.x);

    minY =
      Math.min(minY, point.y);

    maxX =
      Math.max(maxX, point.x);

    maxY =
      Math.max(maxY, point.y);

  });

  const padding = 0.025;

  minX =
    Math.max(
      0,
      minX - padding
    );

  minY =
    Math.max(
      0,
      minY - padding
    );

  maxX =
    Math.min(
      1,
      maxX + padding
    );

  maxY =
    Math.min(
      1,
      maxY + padding
    );

  const x =
    (1 - maxX) *
    window.innerWidth;

  const y =
    minY *
    window.innerHeight;

  const width =
    (maxX - minX) *
    window.innerWidth;

  const height =
    (maxY - minY) *
    window.innerHeight;

  ctx.save();

  ctx.strokeStyle = color;

  ctx.lineWidth = 1.5;

  ctx.shadowColor = color;

  ctx.shadowBlur = 15;

  ctx.strokeRect(
    x,
    y,
    width,
    height
  );

  ctx.font =
    "bold 10px monospace";

  ctx.fillStyle = color;

  ctx.fillText(
    label,
    x,
    Math.max(15, y - 7)
  );

  ctx.restore();
}


/* =====================================================
   DISTANCE
   ===================================================== */

function distance(a, b) {

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  return Math.sqrt(
    dx * dx + dy * dy
  );
}


/* =====================================================
   FINGER STATES
   ===================================================== */

function getFingerStates(hand) {

  return {

    index:
      hand[8].y <
      hand[6].y,

    middle:
      hand[12].y <
      hand[10].y,

    ring:
      hand[16].y <
      hand[14].y,

    pinky:
      hand[20].y <
      hand[18].y

  };
}


/* =====================================================
   PINCH
   ===================================================== */

function isPinching(hand) {

  const thumb =
    hand[4];

  const index =
    hand[8];

  return (
    distance(
      thumb,
      index
    ) < 0.055
  );
}


/* =====================================================
   OPEN PALM
   ===================================================== */

function isOpenPalm(hand) {

  const f =
    getFingerStates(hand);

  return (
    f.index &&
    f.middle &&
    f.ring &&
    f.pinky
  );
}


/* =====================================================
   FIST
   ===================================================== */

function isFist(hand) {

  const f =
    getFingerStates(hand);

  return (
    !f.index &&
    !f.middle &&
    !f.ring &&
    !f.pinky
  );
}


/* =====================================================
   INDEX ONLY
   ===================================================== */

function isIndexOnly(hand) {

  const f =
    getFingerStates(hand);

  return (
    f.index &&
    !f.middle &&
    !f.ring &&
    !f.pinky
  );
}


/* =====================================================
   TWO FINGER
   ===================================================== */

function isTwoFinger(hand) {

  const f =
    getFingerStates(hand);

  return (
    f.index &&
    f.middle &&
    !f.ring &&
    !f.pinky
  );
}


/* =====================================================
   AIR DRAW
   ===================================================== */

function drawAirPoint(point) {

  if (!lastDrawPoint) {

    lastDrawPoint =
      point;

    return;
  }

  const smoothing = 0.35;

  const smoothPoint = {

    x:
      lastDrawPoint.x +
      (point.x -
        lastDrawPoint.x) *
      smoothing,

    y:
      lastDrawPoint.y +
      (point.y -
        lastDrawPoint.y) *
      smoothing

  };

  drawCtx.save();

  drawCtx.strokeStyle =
    CYAN;

  drawCtx.lineWidth =
    4;

  drawCtx.lineCap =
    "round";

  drawCtx.lineJoin =
    "round";

  drawCtx.shadowColor =
    CYAN;

  drawCtx.shadowBlur =
    22;

  drawCtx.beginPath();

  drawCtx.moveTo(
    lastDrawPoint.x,
    lastDrawPoint.y
  );

  drawCtx.lineTo(
    smoothPoint.x,
    smoothPoint.y
  );

  drawCtx.stroke();

  drawCtx.restore();

  lastDrawPoint =
    smoothPoint;
}


/* =====================================================
   CLEAR DRAWING
   ===================================================== */

function clearDrawing() {

  drawCtx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );

  lastDrawPoint = null;

  terminalMessage(
    "AIR DRAWING CLEARED"
  );
}


/* =====================================================
   HUD CONTROL
   ===================================================== */

function setHUDMinimized(
  minimized
) {

  const panel =
    document.querySelector(".panel");

  const portfolio =
    document.querySelector(".portfolio");

  const terminal =
    document.querySelector(".terminal");

  if (
    !panel ||
    !portfolio ||
    !terminal
  ) {
    return;
  }

  hudMinimized =
    minimized;

  const opacity =
    minimized ? "0.08" : "1";

  const scale =
    minimized
      ? "scale(.75)"
      : "scale(1)";

  panel.style.transition =
    "all .35s ease";

  portfolio.style.transition =
    "all .35s ease";

/* =====================================================
   GESTURE PROCESSOR
   ===================================================== */

function processGesture(
  hand
) {

  if (
    !hand ||
    hand.length < 21
  ) {
    return;
  }


  /* ---------------------------------
     PINCH
     --------------------------------- */

  if (isPinching(hand)) {

    drawing = false;

    lastDrawPoint = null;

    currentGesture =
      "PINCH / SELECT";

    fistStart = 0;

    palmStart = 0;

    showGesture(
      currentGesture
    );

    return;
  }


  /* ---------------------------------
     INDEX = AIR WRITE
     --------------------------------- */

  if (isIndexOnly(hand)) {

    drawing = true;

    fistStart = 0;

    palmStart = 0;

    const point =
      screenPoint(
        hand[8]
      );

    drawAirPoint(point);

    currentGesture =
      "AIR WRITING";

    showGesture(
      currentGesture
    );

    return;
  }


  /* ---------------------------------
     TWO FINGERS
     --------------------------------- */

  if (isTwoFinger(hand)) {

    drawing = false;

    lastDrawPoint = null;

    fistStart = 0;

    palmStart = 0;

    currentGesture =
      "TWO FINGER CURSOR";

    showGesture(
      currentGesture
    );

    return;
  }


  /* ---------------------------------
     OPEN PALM
     --------------------------------- */

  if (isOpenPalm(hand)) {

    drawing = false;

    lastDrawPoint = null;

    fistStart = 0;

    if (palmStart === 0) {

      palmStart =
        performance.now();

      palmActionDone =
        false;
    }

    const held =
      performance.now() -
      palmStart;

    if (
      held > 700 &&
      !palmActionDone
    ) {

      setHUDMinimized(false);

      palmActionDone =
        true;
    }

    currentGesture =
      "OPEN PALM";

    showGesture(
      currentGesture
    );

    return;
  }


  /* ---------------------------------
     FIST
     --------------------------------- */

  if (isFist(hand)) {

    drawing = false;

    lastDrawPoint = null;

    palmStart = 0;

    palmActionDone = false;

    if (fistStart === 0) {

      fistStart =
        performance.now();

      fistActionDone =
        false;
    }

    const held =
      performance.now() -
      fistStart;

    /*
       0.8 sec = minimize HUD
       2.2 sec = clear drawing
    */

    if (
      held > 800 &&
      !fistActionDone
    ) {

      setHUDMinimized(true);

      fistActionDone =
        true;
    }

    if (
      held > 2200 &&
      fistActionDone
    ) {

      if (
        currentGesture !==
        "CLEARING"
      ) {

        clearDrawing();

        currentGesture =
          "CLEARING";
      }
    }

    showGesture(
      "FIST / HOLD"
    );

    return;
  }


  /* ---------------------------------
     NOTHING
     --------------------------------- */

  drawing = false;

  lastDrawPoint = null;

  fistStart = 0;

  palmStart = 0;

  fistActionDone = false;
  palmActionDone = false;

  currentGesture =
    "NONE";
}

/* =====================================================
   MEDIAPIPE RESULTS
   ===================================================== */

hands.onResults(
  results => {

    ctx.clearRect(
      0,
      0,
      window.innerWidth,
      window.innerHeight
    );

    const detected =
      results.multiHandLandmarks || [];

    const handedness =
      results.multiHandedness || [];

    let leftDetected =
      false;

    let rightDetected =
      false;

    let totalLandmarks =
      0;


    detected.forEach(
      (landmarks, index) => {

        totalLandmarks +=
          landmarks.length;


        /*
         * Gesture engine
         */

        processGesture(
          landmarks
        );


        /*
         * MediaPipe hand label
         */

        const mediaLabel =
          handedness[index]?.label ||
          "Unknown";


        /*
         * Because video is mirrored,
         * visual label is swapped.
         */

        const visualLabel =
          mediaLabel === "Left"
            ? "RIGHT"
            : "LEFT";


        const color =
          visualLabel === "LEFT"
            ? CYAN
            : GREEN;


        if (
          visualLabel === "LEFT"
        ) {

          leftDetected =
            true;
        }


        if (
          visualLabel === "RIGHT"
        ) {

          rightDetected =
            true;
        }


        /*
         * Skeleton
         */

        connections.forEach(
          ([a, b]) => {

            if (
              landmarks[a] &&
              landmarks[b]
            ) {

              drawConnection(
                landmarks[a],
                landmarks[b],
                color
              );
            }

          }
        );


        /*
         * Landmarks
         */

        landmarks.forEach(
          (point, landmarkIndex) => {

            drawLandmark(
              point,
              color,
              landmarkIndex
            );

          }
        );


        /*
         * Bounding box
         */

        drawBoundingBox(
          landmarks,
          color,
          visualLabel +
          "_HAND // TRACKED"
        );

      }
    );


    /* ---------------------------------
       UPDATE HUD
       --------------------------------- */

    leftHandEl.textContent =
      leftDetected
        ? "DETECTED"
        : "--";

    rightHandEl.textContent =
      rightDetected
        ? "DETECTED"
        : "--";

    landmarksEl.textContent =
      totalLandmarks;


    if (
      detected.length > 0
    ) {

      statusDot.classList.add(
        "online"
      );

      statusText.textContent =
        "SYSTEM ONLINE // AI TRACKING";

    } else {

      statusDot.classList.remove(
        "online"
      );

      statusText.textContent =
        "SCANNING FOR HAND...";

    }


    updateFPS();

  }
);


/* =====================================================
   FPS
   ===================================================== */

function updateFPS() {

  frameCounter++;

  const now =
    performance.now();

  if (
    now - lastFrameTime >=
    1000
  ) {

    fpsEl.textContent =
      frameCounter;

    frameCounter = 0;

    lastFrameTime =
      now;
  }
}


/* =====================================================
   CAMERA
   ===================================================== */

async function startCamera() {

  try {

    terminalMessage(
      "REQUESTING CAMERA..."
    );

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: "user",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    video.srcObject =
      stream;

    await video.play();


    const camera =
      new Camera(
        video,
        {

          width: 1280,

          height: 720,

          onFrame:
            async () => {

              await hands.send({
                image: video
              });

            }

        }
      );


    camera.start();


    statusText.textContent =
      "SYSTEM ONLINE // CAMERA READY";


    terminalMessage(
      "NEURAL VISION INITIALIZED"
    );

  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

    statusText.textContent =
      "CAMERA PERMISSION REQUIRED";

    terminalMessage(
      "CAMERA ACCESS DENIED"
    );
  }
}
