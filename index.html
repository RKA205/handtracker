<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  SUMIT MAURYA // AI VISION
</title>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --cyan:#00fff7;
  --green:#00ff88;
  --red:#ff315c;
  --bg:#010608;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:var(--bg);

  color:var(--cyan);

  font-family:
    "Courier New",
    monospace;

}


/* CAMERA */

#video{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  transform:scaleX(-1);

  filter:
    brightness(.42)
    contrast(1.35)
    saturate(1.25);

  z-index:1;

}


/* MAIN HAND CANVAS */

#canvas{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  z-index:2;

  pointer-events:none;

}


/* SCANLINES */

.scanlines{

  position:fixed;

  inset:0;

  z-index:4;

  pointer-events:none;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(0,255,247,.025) 0px,
      rgba(0,255,247,.025) 1px,
      transparent 2px,
      transparent 5px
    );

}


/* VIGNETTE */

.vignette{

  position:fixed;

  inset:0;

  z-index:3;

  pointer-events:none;

  background:
    radial-gradient(
      circle,
      transparent 35%,
      rgba(0,0,0,.68) 100%
    );

}


/* TOP BAR */

.topbar{

  position:fixed;

  top:0;
  left:0;
  right:0;

  height:68px;

  padding:
    0 22px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:
    rgba(0,10,14,.78);

  border-bottom:
    1px solid
    rgba(0,255,247,.4);

  backdrop-filter:
    blur(10px);

  z-index:10;

}


.brand{

  display:flex;

  flex-direction:column;

}


.brand-main{

  font-size:19px;

  font-weight:bold;

  letter-spacing:4px;

  text-shadow:
    0 0 5px var(--cyan),
    0 0 18px var(--cyan);

}


.brand-sub{

  margin-top:4px;

  font-size:9px;

  color:var(--green);

  letter-spacing:2px;

}


/* STATUS */

.system-status{

  display:flex;

  align-items:center;

  gap:9px;

  font-size:10px;

  letter-spacing:2px;

}


.status-dot{

  width:9px;
  height:9px;

  border-radius:50%;

  background:var(--red);

  box-shadow:
    0 0 12px var(--red);

}


.status-dot.online{

  background:var(--green);

  box-shadow:
    0 0 15px var(--green);

}


/* COMMON PANEL */

.panel{

  position:fixed;

  top:88px;
  left:18px;

  width:230px;

  padding:16px;

  background:
    rgba(0,10,14,.70);

  border:
    1px solid
    rgba(0,255,247,.25);

  border-left:
    2px solid var(--cyan);

  box-shadow:
    0 0 25px
    rgba(0,255,247,.08);

  backdrop-filter:
    blur(9px);

  z-index:8;

}


.panel-title{

  margin-bottom:14px;

  color:#fff;

  font-size:10px;

  letter-spacing:2px;

}


.line{

  display:flex;

  justify-content:space-between;

  padding:7px 0;

  border-bottom:
    1px solid
    rgba(0,255,247,.08);

  font-size:10px;

}


.value{

  color:#fff;

}


/* PORTFOLIO */

.portfolio{

  position:fixed;

  top:88px;
  right:18px;

  width:245px;

  padding:15px;

  background:
    rgba(0,9,13,.72);

  border:
    1px solid
    rgba(0,255,247,.3);

  z-index:8;

  backdrop-filter:
    blur(9px);

}


.portfolio-title{

  color:#fff;

  font-size:10px;

  letter-spacing:2px;

  margin-bottom:12px;

}


.site{

  display:block;

  margin-top:9px;

  padding:11px;

  color:var(--cyan);

  text-decoration:none;

  border:
    1px solid
    rgba(0,255,247,.2);

  background:
    rgba(0,255,247,.025);

  transition:
    .25s;

}


.site:hover{

  color:#000;

  background:var(--cyan);

  box-shadow:
    0 0 20px var(--cyan);

}


.site-name{

  display:block;

  font-size:10px;

  font-weight:bold;

  letter-spacing:1px;

}


.site-url{

  display:block;

  margin-top:5px;

  font-size:8px;

  opacity:.75;

  word-break:break-all;

}


/* TERMINAL */

.terminal{

  position:fixed;

  left:18px;
  bottom:22px;

  width:330px;

  max-width:
    calc(100vw - 36px);

  padding:12px;

  background:
    rgba(0,8,11,.78);

  border:
    1px solid
    rgba(0,255,247,.25);

  z-index:8;

  backdrop-filter:
    blur(8px);

}


.terminal-head{

  color:var(--green);

  font-size:9px;

  margin-bottom:7px;

  letter-spacing:2px;

}


#terminalText{

  color:var(--cyan);

  font-size:10px;

  line-height:1.6;

  min-height:32px;

}


/* VOICE */

#voiceBtn{

  position:fixed;

  right:20px;
  bottom:25px;

  width:55px;
  height:55px;

  border-radius:50%;

  border:
    1px solid var(--cyan);

  background:
    rgba(0,20,25,.8);

  color:var(--cyan);

  font-size:21px;

  cursor:pointer;

  box-shadow:
    0 0 12px
    rgba(0,255,247,.3);

  z-index:12;

}


#voiceBtn.active{

  animation:
    voicePulse 1s infinite;

  color:#000;

  background:var(--cyan);

}


@keyframes voicePulse{

  0%,100%{

    box-shadow:
      0 0 10px var(--cyan);

  }

  50%{

    box-shadow:
      0 0 35px var(--cyan),
      0 0 60px var(--cyan);

  }

}


/* CROSSHAIR */

.crosshair{

  position:fixed;

  left:50%;
  top:50%;

  width:70px;
  height:70px;

  transform:
    translate(-50%,-50%);

  border:
    1px solid
    rgba(0,255,247,.18);

  border-radius:50%;

  z-index:5;

  pointer-events:none;

}


.crosshair::before,
.crosshair::after{

  content:"";

  position:absolute;

  background:
    rgba(0,255,247,.25);

}


.crosshair::before{

  width:100%;
  height:1px;

  top:50%;

}


.crosshair::after{

  width:1px;
  height:100%;

  left:50%;

}


/* CORNERS */

.corner{

  position:fixed;

  width:42px;
  height:42px;

  z-index:7;

  pointer-events:none;

}


.tl{

  top:78px;
  left:12px;

  border-top:
    2px solid var(--cyan);

  border-left:
    2px solid var(--cyan);

}


.tr{

  top:78px;
  right:12px;

  border-top:
    2px solid var(--cyan);

  border-right:
    2px solid var(--cyan);

}


.bl{

  bottom:12px;
  left:12px;

  border-bottom:
    2px solid var(--cyan);

  border-left:
    2px solid var(--cyan);

}


.br{

  bottom:12px;
  right:12px;

  border-bottom:
    2px solid var(--cyan);

  border-right:
    2px solid var(--cyan);

}


/* MOBILE */

@media(max-width:700px){

  .brand-main{

    font-size:13px;

    letter-spacing:2px;

  }

  .brand-sub{

    font-size:7px;

  }

  .panel{

    width:180px;

    top:78px;
    left:10px;

    padding:10px;

  }

  .portfolio{

    width:180px;

    top:78px;
    right:10px;

    padding:10px;

  }

  .terminal{

    width:260px;

    left:10px;
    bottom:12px;

  }

  #voiceBtn{

    right:12px;
    bottom:12px;

  }

}

</style>

<script>
/* =====================================================
   SUMIT MAURYA
   PART 2 // FULL AI HAND TRACKING CORE
   ===================================================== */

(function () {

  "use strict";

  /* ===================================================
     ELEMENTS
     =================================================== */

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  const statusDot =
    document.getElementById("statusDot");

  const statusText =
    document.getElementById("statusText");

  const leftHandEl =
    document.getElementById("leftHand");

  const rightHandEl =
    document.getElementById("rightHand");

  const landmarksEl =
    document.getElementById("landmarks");

  const fpsEl =
    document.getElementById("fps");

  const terminalText =
    document.getElementById("terminalText");


  /* ===================================================
     CONFIG
     =================================================== */

  const CYAN = "#00fff7";
  const GREEN = "#00ff88";

  let fpsFrames = 0;

  let fpsLastTime =
    performance.now();


  /* ===================================================
     CANVAS
     =================================================== */

  function resizeCanvas() {

    const dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    canvas.width =
      window.innerWidth * dpr;

    canvas.height =
      window.innerHeight * dpr;

    canvas.style.width =
      window.innerWidth + "px";

    canvas.style.height =
      window.innerHeight + "px";

    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );
  }


  window.addEventListener(
    "resize",
    resizeCanvas
  );


  resizeCanvas();


  /* ===================================================
     TERMINAL
     =================================================== */

  function terminal(message) {

    if (!terminalText) {
      return;
    }

    terminalText.textContent =
      "> " + message;
  }


  /*
   * Part 3 के लिए global function.
   * Part 3 load होने के बाद automatically
   * gesture processing शुरू हो जाएगा.
   */

  window.SumitTerminal =
    terminal;


  /* ===================================================
     MEDIAPIPE HANDS
     =================================================== */

  const hands =
    new Hands({

      locateFile:
        function (file) {

          return (
            "https://cdn.jsdelivr.net/npm/" +
            "@mediapipe/hands/" +
            file
          );

        }

    });


  hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: 0.65,

    minTrackingConfidence: 0.65

  });


  /* ===================================================
     HAND CONNECTIONS
     =================================================== */

  const CONNECTIONS = [

    [0, 1],
    [1, 2],
    [2, 3],
    [3, 4],

    [0, 5],
    [5, 6],
    [6, 7],
    [7, 8],

    [0, 9],
    [9, 10],
    [10, 11],
    [11, 12],

    [0, 13],
    [13, 14],
    [14, 15],
    [15, 16],

    [0, 17],
    [17, 18],
    [18, 19],
    [19, 20],

    [5, 9],
    [9, 13],
    [13, 17]

  ];


  /* ===================================================
     SCREEN POSITION
     =================================================== */

  function screenPoint(point) {

    return {

      x:
        (1 - point.x) *
        window.innerWidth,

      y:
        point.y *
        window.innerHeight

    };

  }


  /* ===================================================
     NEON CONNECTION
     =================================================== */

  function drawConnection(
    a,
    b,
    color
  ) {

    const p1 =
      screenPoint(a);

    const p2 =
      screenPoint(b);


    ctx.save();

    ctx.strokeStyle =
      color;

    ctx.lineWidth =
      3;

    ctx.lineCap =
      "round";

    ctx.shadowColor =
      color;

    ctx.shadowBlur =
      18;


    ctx.beginPath();

    ctx.moveTo(
      p1.x,
      p1.y
    );

    ctx.lineTo(
      p2.x,
      p2.y
    );

    ctx.stroke();


    /* Bright inner line */

    ctx.shadowBlur = 0;

    ctx.globalAlpha =
      0.55;

    ctx.strokeStyle =
      "#ffffff";

    ctx.lineWidth =
      0.8;


    ctx.beginPath();

    ctx.moveTo(
      p1.x,
      p1.y
    );

    ctx.lineTo(
      p2.x,
      p2.y
    );

    ctx.stroke();


    ctx.restore();

  }


  /* ===================================================
     LANDMARK
     =================================================== */

  function drawLandmark(
    point,
    color,
    index
  ) {

    const p =
      screenPoint(point);


    ctx.save();


    ctx.fillStyle =
      color;

    ctx.shadowColor =
      color;

    ctx.shadowBlur =
      18;


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      5.5,
      0,
      Math.PI * 2
    );

    ctx.fill();


    /* Inner dark core */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
      "#001416";


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      2.7,
      0,
      Math.PI * 2
    );

    ctx.fill();


    /* Important point numbers */

    if (
      index === 0 ||
      index === 4 ||
      index === 8 ||
      index === 12 ||
      index === 16 ||
      index === 20
    ) {

      ctx.font =
        "9px monospace";

      ctx.fillStyle =
        color;

      ctx.fillText(
        String(index),
        p.x + 8,
        p.y - 7
      );

    }


    ctx.restore();

  }


  /* ===================================================
     BOUNDING BOX
     =================================================== */

  function drawBoundingBox(
    landmarks,
    color,
    label
  ) {

    let minX = 1;
    let minY = 1;

    let maxX = 0;
    let maxY = 0;


    landmarks.forEach(
      function (point) {

        minX =
          Math.min(
            minX,
            point.x
          );

        minY =
          Math.min(
            minY,
            point.y
          );

        maxX =
          Math.max(
            maxX,
            point.x
          );

        maxY =
          Math.max(
            maxY,
            point.y
          );

      }
    );


    const padding =
      0.025;


    minX =
      Math.max(
        0,
        minX - padding
      );

    minY =
      Math.max(
        0,
        minY - padding
      );

    maxX =
      Math.min(
        1,
        maxX + padding
      );

    maxY =
      Math.min(
        1,
        maxY + padding
      );


    const x =
      (1 - maxX) *
      window.innerWidth;

    const y =
      minY *
      window.innerHeight;

    const width =
      (maxX - minX) *
      window.innerWidth;

    const height =
      (maxY - minY) *
      window.innerHeight;


    ctx.save();


    ctx.strokeStyle =
      color;

    ctx.lineWidth =
      1.4;

    ctx.shadowColor =
      color;

    ctx.shadowBlur =
      12;


    ctx.strokeRect(
      x,
      y,
      width,
      height
    );


    ctx.shadowBlur = 0;

    ctx.font =
      "bold 10px monospace";

    ctx.fillStyle =
      color;


    ctx.fillText(
      label,
      x,
      Math.max(
        15,
        y - 7
      )
    );


    ctx.restore();

  }


  /* ===================================================
     FPS
     =================================================== */

  function updateFPS() {

    fpsFrames++;


    const now =
      performance.now();


    if (
      now - fpsLastTime >=
      1000
    ) {

      if (fpsEl) {

        fpsEl.textContent =
          String(fpsFrames);

      }


      fpsFrames = 0;

      fpsLastTime =
        now;

    }

  }


  /* ===================================================
     HAND RESULTS
     =================================================== */

  hands.onResults(
    function (results) {

      /* Clear tracking canvas */

      ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );


      const detected =
        results.multiHandLandmarks || [];


      const handedness =
        results.multiHandedness || [];


      let leftDetected =
        false;

      let rightDetected =
        false;

      let totalLandmarks =
        0;


      /* =================================================
         PROCESS EVERY HAND
         ================================================= */

      detected.forEach(
        function (
          landmarks,
          index
        ) {

          totalLandmarks +=
            landmarks.length;


          /* ---------------------------------------------
             CONNECT TO GESTURE ENGINE
             --------------------------------------------- */

          if (
            typeof window.SumitGestureEngine ===
            "function"
          ) {

            window.SumitGestureEngine(
              landmarks
            );

          }


          /* ---------------------------------------------
             HAND LABEL
             --------------------------------------------- */

          const mediaLabel =
            handedness[index]?.label ||
            "Unknown";


          /*
           * Camera mirror की वजह से
           * visual label reverse किया गया है.
           */

          const visualLabel =
            mediaLabel === "Left"
              ? "RIGHT"
              : "LEFT";


          const color =
            visualLabel === "LEFT"
              ? CYAN
              : GREEN;


          if (
            visualLabel ===
            "LEFT"
          ) {

            leftDetected =
              true;

          }


          if (
            visualLabel ===
            "RIGHT"
          ) {

            rightDetected =
              true;

          }


          /* ---------------------------------------------
             DRAW SKELETON
             --------------------------------------------- */

          CONNECTIONS.forEach(
            function (
              connection
            ) {

              const a =
                connection[0];

              const b =
                connection[1];


              if (
                landmarks[a] &&
                landmarks[b]
              ) {

                drawConnection(
                  landmarks[a],
                  landmarks[b],
                  color
                );

              }

            }
          );


          /* ---------------------------------------------
             DRAW 21 LANDMARKS
             --------------------------------------------- */

          landmarks.forEach(
            function (
              point,
              pointIndex
            ) {

              drawLandmark(
                point,
                color,
                pointIndex
              );

            }
          );


          /* ---------------------------------------------
             BOUNDING BOX
             --------------------------------------------- */

          drawBoundingBox(
            landmarks,
            color,
            visualLabel +
            " // AI TRACKED"
          );

        }
      );


      /* =================================================
         HUD STATUS
         ================================================= */

      if (leftHandEl) {

        leftHandEl.textContent =
          leftDetected
            ? "DETECTED"
            : "--";

      }


      if (rightHandEl) {

        rightHandEl.textContent =
          rightDetected
            ? "DETECTED"
            : "--";

      }


      if (landmarksEl) {

        landmarksEl.textContent =
          String(
            totalLandmarks
          );

      }


      /* =================================================
         SYSTEM STATUS
         ================================================= */

      if (
        detected.length > 0
      ) {

        if (statusDot) {

          statusDot.classList.add(
            "online"
          );

        }


        if (statusText) {

          statusText.textContent =
            detected.length === 2
              ? "SYSTEM ONLINE // 2 HANDS"
              : "SYSTEM ONLINE // AI TRACKING";

        }

      } else {

        if (statusDot) {

          statusDot.classList.remove(
            "online"
          );

        }


        if (statusText) {

          statusText.textContent =
            "SCANNING FOR HAND...";

        }

      }


      updateFPS();

    }
  );


  /* ===================================================
     CAMERA
     =================================================== */

  async function startCamera() {

    try {

      terminal(
        "REQUESTING CAMERA ACCESS..."
      );


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Camera API unavailable"
        );

      }


      const stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: {

              facingMode: "user",

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            },

            audio: false

          });


      video.srcObject =
        stream;


      await video.play();


      const camera =
        new Camera(
          video,
          {

            width: 1280,

            height: 720,

            onFrame:
              async function () {

                try {

                  await hands.send({
                    image: video
                  });

                } catch (error) {

                  console.error(
                    "Hands error:",
                    error
                  );

                }

              }

          }
        );


      camera.start();


      if (statusDot) {

        statusDot.classList.add(
          "online"
        );

      }


      if (statusText) {

        statusText.textContent =
          "SYSTEM ONLINE // CAMERA READY";

      }


      terminal(
        "AI HAND VISION CORE ONLINE"
      );


    } catch (error) {

      console.error(
        "Camera startup error:",
        error
      );


      if (statusDot) {

        statusDot.classList.remove(
          "online"
        );

      }


      if (statusText) {

        statusText.textContent =
          "CAMERA ACCESS REQUIRED";

      }


      terminal(
        "CAMERA ERROR // CHECK PERMISSION"
      );

    }

  }


  /* ===================================================
     START CAMERA
     =================================================== */

  startCamera();


})();
</script>
  
<script>
/* =====================================================
   PART 3
   SUMIT MAURYA // GESTURE ENGINE
   NO EDIT REQUIRED
   ===================================================== */

(function () {

  let lastPoint = null;
  let fistStarted = 0;
  let palmStarted = 0;
  let fistDone = false;
  let palmDone = false;

  /* ---------- AIR DRAW CANVAS ---------- */

  const drawCanvas =
    document.createElement("canvas");

  drawCanvas.style.cssText =
    "position:fixed;" +
    "inset:0;" +
    "width:100%;" +
    "height:100%;" +
    "z-index:6;" +
    "pointer-events:none;";

  document.body.appendChild(drawCanvas);

  const dctx =
    drawCanvas.getContext("2d");


  function resizeDrawCanvas() {

    const dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    drawCanvas.width =
      innerWidth * dpr;

    drawCanvas.height =
      innerHeight * dpr;

    drawCanvas.style.width =
      innerWidth + "px";

    drawCanvas.style.height =
      innerHeight + "px";

    dctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );
  }

  resizeDrawCanvas();

  window.addEventListener(
    "resize",
    resizeDrawCanvas
  );


  /* ---------- HELPERS ---------- */

  function distance(a, b) {

    const x = a.x - b.x;
    const y = a.y - b.y;

    return Math.sqrt(
      x * x + y * y
    );
  }


  function fingers(hand) {

    return {

      index:
        hand[8].y < hand[6].y,

      middle:
        hand[12].y < hand[10].y,

      ring:
        hand[16].y < hand[14].y,

      pinky:
        hand[20].y < hand[18].y

    };
  }


  function pinch(hand) {

    return distance(
      hand[4],
      hand[8]
    ) < 0.075;
  }


  function indexOnly(hand) {

    const f = fingers(hand);

    return (
      f.index &&
      !f.middle &&
      !f.ring &&
      !f.pinky
    );
  }


  function twoFinger(hand) {

    const f = fingers(hand);

    return (
      f.index &&
      f.middle &&
      !f.ring &&
      !f.pinky
    );
  }


  function openPalm(hand) {

    const f = fingers(hand);

    return (
      f.index &&
      f.middle &&
      f.ring &&
      f.pinky
    );
  }


  function fist(hand) {

    const f = fingers(hand);

    return (
      !f.index &&
      !f.middle &&
      !f.ring &&
      !f.pinky
    );
  }


  function point(landmark) {

    return {

      x:
        (1 - landmark.x) *
        innerWidth,

      y:
        landmark.y *
        innerHeight

    };
  }


  /* ---------- AIR WRITING ---------- */

  function write(pointNow) {

    if (!lastPoint) {

      lastPoint =
        pointNow;

      return;
    }


    const smooth = 0.3;

    const p = {

      x:
        lastPoint.x +
        (pointNow.x -
          lastPoint.x) *
        smooth,

      y:
        lastPoint.y +
        (pointNow.y -
          lastPoint.y) *
        smooth

    };


    dctx.save();

    dctx.strokeStyle =
      "#00fff7";

    dctx.lineWidth =
      4;

    dctx.lineCap =
      "round";

    dctx.lineJoin =
      "round";

    dctx.shadowColor =
      "#00fff7";

    dctx.shadowBlur =
      22;


    dctx.beginPath();

    dctx.moveTo(
      lastPoint.x,
      lastPoint.y
    );

    dctx.lineTo(
      p.x,
      p.y
    );

    dctx.stroke();

    dctx.restore();

    lastPoint = p;
  }


  function clearDrawing() {

    dctx.clearRect(
      0,
      0,
      innerWidth,
      innerHeight
    );

    lastPoint = null;

    if (
      typeof terminalMessage ===
      "function"
    ) {

      terminalMessage(
        "DRAWING CLEARED"
      );
    }
  }


  /* ---------- HUD ---------- */

  function hud(minimize) {

    const elements = [

      document.querySelector(".panel"),

      document.querySelector(".portfolio"),

      document.querySelector(".terminal")

    ];


    elements.forEach(
      element => {

        if (!element) return;

        element.style.transition =
          "all .35s ease";

        element.style.opacity =
          minimize ? ".08" : "1";

        element.style.transform =
          minimize
            ? "scale(.72)"
            : "scale(1)";
      }
    );


    if (
      typeof terminalMessage ===
      "function"
    ) {

      terminalMessage(
        minimize
          ? "HUD MINIMIZED"
          : "HUD MAXIMIZED"
      );
    }
  }


  /* ---------- GESTURE STATUS ---------- */

  function gesture(text) {

    const terminal =
      document.getElementById(
        "terminalText"
      );

    if (terminal) {

      terminal.textContent =
        "> GESTURE :: " +
        text;
    }
  }


  /* ---------- MAIN ENGINE ---------- */

  function process(hand) {

    if (
      !hand ||
      hand.length < 21
    ) {
      return;
    }


    /* PINCH */

    if (pinch(hand)) {

      lastPoint = null;

      fistStarted = 0;
      palmStarted = 0;

      gesture(
        "PINCH / SELECT"
      );

      return;
    }


    /* AIR WRITING */

    if (indexOnly(hand)) {

      fistStarted = 0;
      palmStarted = 0;

      write(
        point(hand[8])
      );

      gesture(
        "AIR WRITING"
      );

      return;
    }


    /* TWO FINGER */

    if (twoFinger(hand)) {

      lastPoint = null;

      fistStarted = 0;
      palmStarted = 0;

      gesture(
        "TWO FINGER CURSOR"
      );

      return;
    }


    /* OPEN PALM */

    if (openPalm(hand)) {

      lastPoint = null;

      fistStarted = 0;

      if (!palmStarted) {

        palmStarted =
          performance.now();

        palmDone = false;
      }


      if (
        performance.now() -
        palmStarted >
        650 &&
        !palmDone
      ) {

        hud(false);

        palmDone = true;
      }


      gesture(
        "OPEN PALM"
      );

      return;
    }


    /* FIST */

    if (fist(hand)) {

      lastPoint = null;

      palmStarted = 0;

      if (!fistStarted) {

        fistStarted =
          performance.now();

        fistDone = false;
      }


      const held =
        performance.now() -
        fistStarted;


      if (
        held > 800 &&
        !fistDone
      ) {

        hud(true);

        fistDone = true;
      }


      if (
        held > 2200
      ) {

        clearDrawing();

        fistStarted =
          performance.now();
      }


      gesture(
        "FIST / HOLD"
      );

      return;
    }


    lastPoint = null;

    fistStarted = 0;
    palmStarted = 0;

    fistDone = false;
    palmDone = false;

  }


  /*
   * Global function.
   * अगला Part इसे automatically use करेगा.
   */

  window.SumitGestureEngine =
    process;


})();
    </script>
  <script>
/* =====================================================
   SUMIT MAURYA
   PART 4 // VOICE AI + COMMAND CENTER
   ===================================================== */

(function () {

  "use strict";


  /* ===================================================
     ELEMENTS
     =================================================== */

  const voiceBtn =
    document.getElementById("voiceBtn");

  const terminalText =
    document.getElementById("terminalText");


  /* ===================================================
     TERMINAL
     =================================================== */

  function log(message) {

    if (!terminalText) {
      return;
    }

    terminalText.textContent =
      "> " + message;

  }


  /* ===================================================
     VOICE ENGINE
     =================================================== */

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  let recognition = null;

  let listening = false;


  if (SpeechRecognition) {

    recognition =
      new SpeechRecognition();


    recognition.lang =
      "en-IN";


    recognition.continuous =
      false;


    recognition.interimResults =
      false;


    recognition.maxAlternatives =
      1;


    recognition.onstart =
      function () {

        listening = true;

        if (voiceBtn) {

          voiceBtn.classList.add(
            "active"
          );

        }

        log(
          "VOICE AI // LISTENING..."
        );

      };


    recognition.onresult =
      function (event) {

        const result =
          event.results[0][0].transcript
            .toLowerCase()
            .trim();


        log(
          "VOICE :: " +
          result
        );


        executeCommand(
          result
        );

      };


    recognition.onerror =
      function (event) {

        console.warn(
          "Voice error:",
          event.error
        );


        log(
          "VOICE ERROR // " +
          event.error
        );

      };


    recognition.onend =
      function () {

        listening = false;

        if (voiceBtn) {

          voiceBtn.classList.remove(
            "active"
          );

        }

      };

  }


  /* ===================================================
     START / STOP VOICE
     =================================================== */

  function toggleVoice() {

    if (!recognition) {

      log(
        "VOICE API NOT SUPPORTED"
      );

      return;

    }


    try {

      if (listening) {

        recognition.stop();

      } else {

        recognition.start();

      }

    } catch (error) {

      console.warn(error);

    }

  }


  if (voiceBtn) {

    voiceBtn.addEventListener(
      "click",
      toggleVoice
    );

  }


  /* ===================================================
     TEXT TO SPEECH
     =================================================== */

  function speak(text) {

    if (
      !("speechSynthesis" in window)
    ) {

      return;

    }


    window.speechSynthesis.cancel();


    const speech =
      new SpeechSynthesisUtterance(
        text
      );


    speech.lang =
      "en-IN";


    speech.rate =
      0.95;


    speech.pitch =
      0.85;


    window.speechSynthesis.speak(
      speech
    );

  }


  /* ===================================================
     COMMAND ENGINE
     =================================================== */

  function executeCommand(
    command
  ) {

    /* -----------------------------------------------
       HELP
       ----------------------------------------------- */

    if (
      command.includes("help") ||
      command.includes("commands")
    ) {

      log(
        "COMMANDS: OPEN PORTFOLIO / OPEN PROJECT / MAXIMIZE / MINIMIZE / CLEAR / STATUS"
      );

      speak(
        "Available commands are portfolio, project, maximize, minimize, clear, and status."
      );

      return;

    }


    /* -----------------------------------------------
       PORTFOLIO
       ----------------------------------------------- */

    if (
      command.includes("portfolio") ||
      command.includes("sumit")
    ) {

      window.open(
        "https://rka205.github.io/Sumit/",
        "_blank",
        "noopener"
      );


      log(
        "PORTFOLIO // ACCESSING"
      );


      speak(
        "Opening Sumit Maurya portfolio."
      );


      return;

    }


    /* -----------------------------------------------
       PROJECT
       ----------------------------------------------- */

    if (
      command.includes("project") ||
      command.includes("school") ||
      command.includes("sk website")
    ) {

      window.open(
        "https://rka205.github.io/SK/",
        "_blank",
        "noopener"
      );


      log(
        "PROJECT // ACCESSING"
      );


      speak(
        "Opening project website."
      );


      return;

    }


    /* -----------------------------------------------
       MAXIMIZE
       ----------------------------------------------- */

    if (
      command.includes("maximize") ||
      command.includes("maximise") ||
      command.includes("full")
    ) {

      if (
        typeof window.SumitHUD ===
        "function"
      ) {

        window.SumitHUD(false);

      } else {

        const elements = [
          ".panel",
          ".portfolio",
          ".terminal"
        ];


        elements.forEach(
          selector => {

            const element =
              document.querySelector(
                selector
              );


            if (element) {

              element.style.opacity =
                "1";

              element.style.transform =
                "scale(1)";

            }

          }
        );

      }


      log(
        "HUD // MAXIMIZED"
      );


      speak(
        "Interface maximized."
      );


      return;

    }


    /* -----------------------------------------------
       MINIMIZE
       ----------------------------------------------- */

    if (
      command.includes("minimize") ||
      command.includes("minimise")
    ) {

      if (
        typeof window.SumitHUD ===
        "function"
      ) {

        window.SumitHUD(true);

      } else {

        const elements = [
          ".panel",
          ".portfolio",
          ".terminal"
        ];


        elements.forEach(
          selector => {

            const element =
              document.querySelector(
                selector
              );


            if (element) {

              element.style.opacity =
                ".08";

              element.style.transform =
                "scale(.72)";

            }

          }
        );

      }


      log(
        "HUD // MINIMIZED"
      );


      speak(
        "Interface minimized."
      );


      return;

    }


    /* -----------------------------------------------
       CLEAR
       ----------------------------------------------- */

    if (
      command.includes("clear") ||
      command.includes("erase") ||
      command.includes("delete drawing")
    ) {

      /*
       * Part 3 drawing canvas खोजकर clear
       */

      const canvases =
        document.querySelectorAll(
          "canvas"
        );


      canvases.forEach(
        canvas => {

          /*
           * Main tracking canvas को छोड़कर
           * बाकी canvas clear किया जाएगा.
           */

          if (
            canvas.id !== "canvas"
          ) {

            const context =
              canvas.getContext("2d");


            if (context) {

              context.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
              );

            }

          }

        }
      );


      log(
        "AIR DRAWING // CLEARED"
      );


      speak(
        "Drawing cleared."
      );


      return;

    }


    /* -----------------------------------------------
       STATUS
       ----------------------------------------------- */

    if (
      command.includes("status") ||
      command.includes("system")
    ) {

      const landmarks =
        document.getElementById(
          "landmarks"
        );


      const count =
        landmarks
          ? landmarks.textContent
          : "zero";


      log(
        "SYSTEM ONLINE // LANDMARKS " +
        count
      );


      speak(
        "AI vision system is online."
      );


      return;

    }


    /* -----------------------------------------------
       UNKNOWN COMMAND
       ----------------------------------------------- */

    log(
      "COMMAND NOT RECOGNIZED"
    );


  }


  /* ===================================================
     KEYBOARD COMMANDS
     =================================================== */

  document.addEventListener(
    "keydown",
    function (event) {

      /* V = voice */

      if (
        event.key.toLowerCase() ===
        "v"
      ) {

        toggleVoice();

      }


      /* C = clear */

      if (
        event.key.toLowerCase() ===
        "c"
      ) {

        executeCommand(
          "clear"
        );

      }


      /* P = portfolio */

      if (
        event.key.toLowerCase() ===
        "p"
      ) {

        executeCommand(
          "portfolio"
        );

      }


      /* M = minimize */

      if (
        event.key.toLowerCase() ===
        "m"
      ) {

        executeCommand(
          "minimize"
        );

      }


      /* X = maximize */

      if (
        event.key.toLowerCase() ===
        "x"
      ) {

        executeCommand(
          "maximize"
        );

      }

    }
  );


  /* ===================================================
     WELCOME MESSAGE
     =================================================== */

  setTimeout(
    function () {

      log(
        "SUMIT MAURYA // AI VISION READY"
      );

    },
    1200
  );


  /* ===================================================
     GLOBAL COMMAND ACCESS
     =================================================== */

  window.SumitVoiceCommand =
    executeCommand;


})();
